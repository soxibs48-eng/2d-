<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pixel Runner: Anti-Gravity Protocol</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <!-- TOUCH CONTROLS (Mobile / Tablet) -->
    <div id="touch-controls">
      <div id="touch-left">
        <button id="touch-flip" class="touch-btn">FLIP GRAVITY</button>
      </div>
      <div id="touch-right">
        <button id="touch-jump" class="touch-btn">JUMP</button>
        <button id="touch-slide" class="touch-btn">SLIDE</button>
      </div>
    </div>
  </div>

  <!-- Game Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/player.js"></script>
  <script src="js/obstacles.js"></script>
  <script src="js/pickups.js"></script>
  <script src="js/spawner.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
